[pytest]
# -------------------------------------------------------------------
# Pytest configuration for ACEest Fitness Project
# -------------------------------------------------------------------

# Automatically discover tests in these folders
testpaths =
    tests

# Only match these naming patterns for test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display minimal but readable output
addopts =
    -q
    --tb=short
    --disable-warnings
    --maxfail=3
    -p no:warnings

# Avoid conflicts from Flask plugin trying to modify response_class
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Ensure environment is predictable (helps headless CI)
env =
    PYTHONUNBUFFERED=1

pythonpath = .
